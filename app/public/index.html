<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Status</title>
</head>
<body>
  <h1>Service Status</h1>

  <section>
    <h2>Services</h2>
    <div id="services"></div>
  </section>

  <section>
    <h2>Add Service</h2>

    <form id="service-form">
      <label>
        Name
        <input id="service-name" type="text" required>
      </label>

      <button type="submit">Add Service</button>
    </form>
  </section>

  <section>
    <h2>Add Incident</h2>

    <form id="incident-form">
      <label>
        Service
        <select id="incident-service" required></select>
      </label>

      <label>
        Message
        <input id="incident-message" type="text" required>
      </label>

      <button type="submit">Add Incident</button>
    </form>
  </section>

  <section>
    <h2>Incidents</h2>
    <div id="incidents"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
